<p class="intro">الخطة مقسّمة على خمس مراحل، والترتيب مقصود: نبدأ بالأمان لأن الأداة تمسح نهائياً، وبعدها دقة المحرك، ثم المسارات الجديدة، ثم المعمارية والميزات. اضغط على أي مهمة حتى تشوف الشرح والحل ومعيار الإنجاز، ومن تخلصها اضغط «تم».</p>

const PRI = { crit:["حرج","c-crit"], high:["عالي","c-high"], mid:["متوسط","c-mid"] };
const ALL = PHASES.flatMap(p => p.tasks.map(t => t.id));
let state = {};      // { "0.1": {done:true, at:"..."} }
let filter = "all";
let db = null, ref = null, docExists = false, writing = Promise.resolve();
const LS_KEY = "sweep-plan-progress";
const keyOf = id => "t" + id.replace(".", "_");

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString("ar-IQ",{day:"numeric",month:"short"}); }catch(e){ return ""; } }

function render(){
  const root = document.getElementById("plan");
  const openSet = new Set([...root.querySelectorAll("details[open]")].map(d => d.dataset.id));
  let html = "";
  let doneTotal = 0;
  for (const p of PHASES){
    const pd = p.tasks.filter(t => state[keyOf(t.id)]?.done).length;
    doneTotal += pd;
    const visible = p.tasks.filter(t => {
      const d = !!state[keyOf(t.id)]?.done;
      return filter === "all" || (filter === "done" ? d : !d);
    });
    html += '<section class="phase" aria-labelledby="h-' + p.id + '"><div class="phead"><h2 id="h-' + p.id + '"><span class="pnum">المرحلة ' + p.n + '</span>' + esc(p.name) + '</h2><span class="pc">' + pd + ' / ' + p.tasks.length + '</span></div><p class="pgoal">' + esc(p.goal) + '</p>';
    if (!visible.length) html += '<p class="empty">' + (filter === "done" ? "ما خلصت أي مهمة بهذي المرحلة بعد." : "كل مهام هذي المرحلة خلصت.") + '</p>';
    for (const t of visible){
      const s = state[keyOf(t.id)] || {};
      const d = !!s.done;
      const [pl, pc] = PRI[t.pri];
      html += '<div class="task' + (d ? " isdone" : "") + '">'
        + '<button class="chk" id="chk-' + keyOf(t.id) + '" data-id="' + t.id + '" aria-pressed="' + d + '" aria-label="' + (d ? "إلغاء الإنجاز: " : "تم: ") + esc(t.t) + '">' + (d ? "✓ تم" : "تم") + '</button>'
        + '<div class="tmain"><details data-id="' + t.id + '"' + (openSet.has(t.id) ? " open" : "") + '><summary>'
        + '<span class="tid">' + t.id + '</span><span class="ttl">' + esc(t.t) + '</span>'
        + '<span class="chip ' + pc + '">' + pl + '</span><span class="eff">' + esc(t.eff) + '</span>'
        + (d && s.at ? '<span class="when">أُنجزت ' + fmtDate(s.at) + '</span>' : "")
        + '<span class="more">التفاصيل</span></summary>'
        + '<div class="body">'
        + '<div class="blk"><h4>ليش</h4><p>' + t.why + '</p></div>'
        + '<div class="blk"><h4>الحل</h4>' + (t.how.trim().startsWith("<") ? t.how : "<p>" + t.how + "</p>") + '</div>'
        + '<div class="blk"><h4>الملفات</h4><p class="files mono">' + esc(t.files) + '</p></div>'
        + '<div class="blk"><h4>متى نعتبرها خلصت</h4><p>' + t.ok + '</p></div>'
        + '</div></details></div></div>';
    }
    html += '</section>';
  }
  root.innerHTML = html;
  document.getElementById("nDone").textContent = doneTotal;
  document.getElementById("nAll").textContent = ALL.length;
  const pct = Math.round(doneTotal / ALL.length * 100);
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("barFill").style.width = pct + "%";
}

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const v = localStorage.getItem(LS_KEY); if (v) state = JSON.parse(v) || {}; }catch(e){} }
function setSync(msg){ document.getElementById("sync").textContent = msg; }

function toggle(id){
  const k = keyOf(id);
  const now = !state[k]?.done;
  const entry = { done: now, at: now ? new Date().toISOString() : null };
  state = { ...state, [k]: entry };
  render();
  saveLocal();
  if (!ref) return;
  setSync("جاري الحفظ…");
  writing = writing.then(async () => {
    try {
      if (docExists) await ref.update({ [k]: entry });
      else { await ref.set(state); docExists = true; }
      setSync("محفوظ على حسابك");
    } catch(e) {
      setSync(e && e.code === "not_granted" ? "عرض فقط: ما عندك صلاحية تعديل" : "تعذّر الحفظ، حاول مرة ثانية");
    }
  });
}

document.getElementById("plan").addEventListener("click", e => {
  const b = e.target.closest(".chk");
  if (b) toggle(b.dataset.id);
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

loadLocal();
render();
setSync("محفوظ على هذا المتصفح");

(async () => {
  try {
    db = window.claude?.use ? await window.claude.use("db") : null;
  } catch(e){ db = null; }
  if (!db) { setSync("محفوظ على هذا المتصفح"); return; }
  ref = db.doc("progress/state");
  ref.onSnapshot(snap => {
    docExists = snap.exists;
    if (snap.exists){
      const data = snap.data() || {};
      const merged = {};
      for (const [k,v] of Object.entries(data)) if (v && typeof v === "object") merged[k] = { done: !!v.done, at: v.at || null };
      state = merged;
      saveLocal();
      render();
    }
    setSync("محفوظ على حسابك");
  }, () => setSync("محفوظ على هذا المتصفح"));
})();
</script>
